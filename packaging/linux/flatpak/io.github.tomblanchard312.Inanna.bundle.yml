# Flatpak manifest for the single-file bundle attached to every GitHub release
# (inanna-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (inanna-<version>-linux-<arch>.tar.gz, built
# on Ubuntu 22.04 by package.sh with the craft-fonts embedded) instead of compiling Rust inside
# flatpak-builder: no network and no vendored crate sources during the build, a few seconds
# instead of 20+ minutes, and byte-for-byte the same binaries as the AppImage/deb/rpm. The script
# unpacks the tarball into `stage/` next to a copy of this file. The binaries need glibc >= 2.35
# and load X11, Wayland, xkbcommon, Vulkan and ALSA at runtime; the freedesktop runtime has all
# of them, and the GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# io.github.tomblanchard312.Inanna.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: io.github.tomblanchard312.Inanna
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: inanna
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Sound for audio and video in slide shows (cpal over ALSA, routed to PulseAudio/PipeWire by
  # the runtime's ALSA plugin).
  - --socket=pulseaudio
  # Open/Save dialogs go through the file-chooser portal (rfd) and drag-and-drop through the
  # document portal, so picked files work anywhere without broad filesystem access. Documents is
  # granted so decks passed by path (the command line, Open Recent) work in the usual place.
  - --filesystem=xdg-run/sharedai
  - --filesystem=xdg-documents
  # Network: update checks reach GitHub. The optional --control server still listens on 127.0.0.1
  # only. Home/host filesystem access is deliberately not granted.
  - --share=network
modules:
  - name: inanna
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/inanna /app/bin/inanna
      - install -Dm755 bin/inanna-cli /app/bin/inanna-cli
      - install -Dm644 share/applications/io.github.tomblanchard312.Inanna.desktop /app/share/applications/io.github.tomblanchard312.Inanna.desktop
      # .inanna; the runtime's shared-mime-info already knows the PowerPoint types.
      - install -Dm644 share/mime/packages/io.github.tomblanchard312.Inanna.xml /app/share/mime/packages/io.github.tomblanchard312.Inanna.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.tomblanchard312.Inanna.metainfo.xml /app/share/metainfo/io.github.tomblanchard312.Inanna.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/inanna /app/share/doc/
    sources:
      - type: dir
        path: stage
