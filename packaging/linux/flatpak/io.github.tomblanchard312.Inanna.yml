# Flatpak manifest for Inanna, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.tomblanchard312.Inanna.yml
#   flatpak run io.github.tomblanchard312.Inanna
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The release's .flatpak bundles are built from io.github.tomblanchard312.Inanna.bundle.yml instead (it
# repackages the Linux tarball); keep runtime-version and finish-args identical in both.
id: io.github.tomblanchard312.Inanna
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: inanna
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Sound for audio and video in slide shows (cpal over ALSA, routed to PulseAudio/PipeWire by
  # the runtime's ALSA plugin).
  - --socket=pulseaudio
  # Open/Save dialogs go through the file-chooser portal (rfd) and drag-and-drop through the
  # document portal, so picked files work anywhere without broad filesystem access. Documents is
  # granted so decks passed by path (the command line, Open Recent) work in the usual place.
  - --filesystem=xdg-run/sharedai
  - --filesystem=xdg-documents
  # Network: update checks reach GitHub. The optional --control server still listens on 127.0.0.1
  # only. Home/host filesystem access is deliberately not granted.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: inanna
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/inanna/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p deckcraft
      - install -Dm755 target/release/inanna /app/bin/inanna
      - install -Dm644 NOTICE /app/share/doc/inanna/NOTICE
      - install -Dm644 packaging/linux/io.github.tomblanchard312.Inanna.desktop /app/share/applications/io.github.tomblanchard312.Inanna.desktop
      - install -Dm644 packaging/linux/io.github.tomblanchard312.Inanna.mime.xml /app/share/mime/packages/io.github.tomblanchard312.Inanna.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.tomblanchard312.Inanna.metainfo.xml.in > /app/share/metainfo/io.github.tomblanchard312.Inanna.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
