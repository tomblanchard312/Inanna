name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      validate-only:
        description: Check private release dependency access without publishing
        type: boolean
        default: false
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: tomblanchard312/craft-common-actions/.github/workflows/private-release.yml@44b245123b4e4dad896decb7e7689d887c57d95f
    with:
      app-name: inanna
      app-title: Inanna
      # Keep identical to ci.yml and freebsd.yml. The shared release workflow sets
      # CRAFT_FONTS_REQUIRED=1 in its packaging steps, so a pin without the reviewed Chinese
      # manifest fails the release instead of silently skipping it.
      craft-fonts-ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
      version: ${{ inputs.version }}
      validate-only: ${{ inputs.validate-only || false }}
      allowed-git-packages: "[[\"enki-speech-ui\",\"git+https://github.com/tomblanchard312/Qanloom.git?rev=d26daada860f8ed9d006d95c7b503515128974c3#d26daada860f8ed9d006d95c7b503515128974c3\"],[\"eridu-style\",\"git+https://github.com/tomblanchard312/eridu-style.git?rev=d3b4cdc03706ac100fae2de907282575652b76ad#d3b4cdc03706ac100fae2de907282575652b76ad\"],[\"sharedai-client\",\"git+https://github.com/tomblanchard312/Qanloom.git?rev=d26daada860f8ed9d006d95c7b503515128974c3#d26daada860f8ed9d006d95c7b503515128974c3\"],[\"sharedai-client\",\"git+https://github.com/tomblanchard312/Qanloom.git?rev=d26daada860f8ed9d006d95c7b503515128974c3#d26daada860f8ed9d006d95c7b503515128974c3\"],[\"sharedai-protocol\",\"git+https://github.com/tomblanchard312/Qanloom.git?rev=d26daada860f8ed9d006d95c7b503515128974c3#d26daada860f8ed9d006d95c7b503515128974c3\"],[\"sharedai-protocol\",\"git+https://github.com/tomblanchard312/Qanloom.git?rev=d26daada860f8ed9d006d95c7b503515128974c3#d26daada860f8ed9d006d95c7b503515128974c3\"]]"
    secrets:
      ERIDU_STYLE_DEPLOY_KEY: ${{ secrets.ERIDU_STYLE_DEPLOY_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
