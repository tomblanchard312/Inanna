[package]
name = "deckcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Inanna egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-media = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
craft-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sharedai-client = { git = "https://github.com/tomblanchard312/Qanloom.git", version = "=0.1.0", rev = "d26daada860f8ed9d006d95c7b503515128974c3" }
sharedai-protocol = { git = "https://github.com/tomblanchard312/Qanloom.git", version = "=0.1.0", rev = "d26daada860f8ed9d006d95c7b503515128974c3" }
tokio = { version = "1.53.3", features = ["rt", "time", "net", "sync"] }
base64 = "0.22"
image = { workspace = true }

[dev-dependencies]
skrifa = { workspace = true }
# kittest's own dev-dependencies do not propagate; tests need both font features explicitly.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.enki-speech-ui]
git = "https://github.com/tomblanchard312/Qanloom.git"
rev = "d26daada860f8ed9d006d95c7b503515128974c3"
